<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR poster · {{ shop.name }}</title>
  <style>
    @page { size: A4; margin: 0; }
    body { margin: 0; font-family: system-ui, "Noto Sans Devanagari", sans-serif; background: #f3f4f6; }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff; box-sizing: border-box; padding: 18mm 16mm; text-align: center; }
    .brand { font-size: 26px; font-weight: 900; letter-spacing: -1px; } .brand b { color: #00c853; }
    .tag { display: inline-block; background: #00e676; color: #000; font-weight: 900; border-radius: 40px; padding: 10px 26px; font-size: 26px; margin-top: 16mm; }
    h1 { font-size: 44px; letter-spacing: -1.5px; margin: 10mm 0 2mm; }
    .sub { font-size: 22px; color: #444; }
    .qr { margin: 10mm auto 6mm; width: 120mm; } .qr svg { width: 100%; height: auto; }
    .hint { font-size: 24px; font-weight: 800; }
    .foot { margin-top: 10mm; color: #6b6b6b; font-size: 16px; }
    .print { position: fixed; right: 16px; bottom: 16px; background: #0a0a0a; color: #fff; border: 0; border-radius: 30px; padding: 14px 22px; font-weight: 800; font-size: 16px; }
    @media print { body { background: #fff; } .print { display: none; } }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="brand">micro bargain<b>.</b></div>
    <div class="tag">आज की ताज़ा डील</div>
    <h1>{{ shop.name }}</h1>
    <div class="sub">भारी छूट · पास की दुकान · रोज़ नए ऑफ़र</div>
    <div class="qr">{{ qr }}</div>
    <div class="hint">📱 फ़ोन के कैमरे से स्कैन करें</div>
    <div class="foot">{{ link }}</div>
  </div>
  <button class="print" onclick="window.print()">प्रिंट / PDF सेव करें</button>
</body>
</html>
