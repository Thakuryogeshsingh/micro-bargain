name: micro_bargain
description: Local Grocery Micro-Bargain - customer & merchant app (role-based, shared codebase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  cached_network_image: ^4.0.6
  intl: ^0.20.3
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  razorpay_flutter: ^1.4.7
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
